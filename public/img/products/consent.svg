<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfe4f6"/><stop offset="1" stop-color="#a8cbe9"/></linearGradient>
